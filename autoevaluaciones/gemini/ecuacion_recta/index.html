        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        const LatexText = ({ text }) => {
            if (!text) return null;
            const parts = text.split(/(\$.*?\$)/g);
            return (
                <span>
                    {parts.map((part, index) => {
                        if (part.startsWith('$') && part.endsWith('$')) {
                            const math = part.slice(1, -1);
                            try {
                                const html = window.katex.renderToString(math, { throwOnError: false });
                                return <span key={index} dangerouslySetInnerHTML={{ __html: html }} />;
                            } catch (e) {
                                return <span key={index}>{part}</span>;
                            }
                        }
                        return <span key={index}>{part}</span>;
                    })}
                </span>
            );
        };

        // COMPONENTE PARA GENERAR GRÁFICOS DINÁMICOS
        const CartesianGraph = ({ graphDef }) => {
            if (!graphDef) return null;
            const { a, b, minX, maxX, minY, maxY, points, xAxisLabel, yAxisLabel } = graphDef;
            const width = 400;
            const height = 300;

            const scaleX = (x) => ((x - minX) / (maxX - minX)) * width;
            const scaleY = (y) => height - ((y - minY) / (maxY - minY)) * height;

            const xTicks = [];
            for(let i = Math.ceil(minX); i <= Math.floor(maxX); i++) xTicks.push(i);
            const yTicks = [];
            for(let i = Math.ceil(minY); i <= Math.floor(maxY); i++) yTicks.push(i);

            // Coordenadas de los bordes de la línea
            const lineStartX = minX;
            const lineStartY = a * minX + b;
            const lineEndX = maxX;
            const lineEndY = a * maxX + b;

            return (
                <div className="flex justify-center mb-6">
                    <svg viewBox={`0 0 ${width} ${height}`} className="w-full max-w-sm bg-white border-2 border-gray-300 rounded-lg shadow-sm">
                        {/* Cuadrícula */}
                        {xTicks.map(x => (
                            <line key={`gx-${x}`} x1={scaleX(x)} y1={0} x2={scaleX(x)} y2={height} stroke="#e5e7eb" strokeWidth={x === 0 ? 2 : 1} />
                        ))}
                        {yTicks.map(y => (
                            <line key={`gy-${y}`} x1={0} y1={scaleY(y)} x2={width} y2={scaleY(y)} stroke="#e5e7eb" strokeWidth={y === 0 ? 2 : 1} />
                        ))}

                        {/* Ejes X e Y gruesos */}
                        {minX <= 0 && maxX >= 0 && <line x1={scaleX(0)} y1={0} x2={scaleX(0)} y2={height} stroke="#374151" strokeWidth="2" />}
                        {minY <= 0 && maxY >= 0 && <line x1={0} y1={scaleY(0)} x2={width} y2={scaleY(0)} stroke="#374151" strokeWidth="2" />}

                        {/* Números en los ejes */}
                        {xTicks.map(x => x !== 0 && (
                            <text key={`tx-${x}`} x={scaleX(x)} y={scaleY(0) + 15} fontSize="11" textAnchor="middle" fill="#6b7280" fontWeight="bold">{x}</text>
                        ))}
                        {yTicks.map(y => y !== 0 && (
                            <text key={`ty-${y}`} x={scaleX(0) - 10} y={scaleY(y) + 4} fontSize="11" textAnchor="end" fill="#6b7280" fontWeight="bold">{y}</text>
                        ))}
                        <text x={scaleX(0) - 10} y={scaleY(0) + 15} fontSize="11" textAnchor="end" fill="#6b7280" fontWeight="bold">0</text>

                        {/* Recta del modelo */}
                        <line x1={scaleX(lineStartX)} y1={scaleY(lineStartY)} x2={scaleX(lineEndX)} y2={scaleY(lineEndY)} stroke="#2563eb" strokeWidth="3" />

                        {/* Puntos de interés */}
                        {points && points.map((p, i) => (
                            <g key={`p-${i}`}>
                                <circle cx={scaleX(p.x)} cy={scaleY(p.y)} r="5" fill="#ef4444" />
                                <text x={scaleX(p.x) + 8} y={scaleY(p.y) - 8} fontSize="13" fill="#ef4444" fontWeight="bold">({p.x}, {p.y})</text>
                            </g>
                        ))}

                        {/* Rótulos de magnitudes (si existen) */}
                        {xAxisLabel && <text x={width - 5} y={scaleY(0) - 10} fontSize="12" textAnchor="end" fill="#111827" fontWeight="bold">{xAxisLabel}</text>}
                        {yAxisLabel && <text x={scaleX(0) + 10} y={15} fontSize="12" textAnchor="start" fill="#111827" fontWeight="bold">{yAxisLabel}</text>}
                    </svg>
                </div>
            );
        };

        const App = () => {
            const [gameState, setGameState] = React.useState('start');
            const [questions, setQuestions] = React.useState([]);
            const [currentQIndex, setCurrentQIndex] = React.useState(0);
            const [score, setScore] = React.useState(0);
            const [attempts, setAttempts] = React.useState(0);
            const [feedback, setFeedback] = React.useState(null);
            const [selectedOption, setSelectedOption] = React.useState(null);

            // Nuevos estados para las estadísticas
            const [firstTryCount, setFirstTryCount] = React.useState(0);
            const [secondTryCount, setSecondTryCount] = React.useState(0);
            const [failedCount, setFailedCount] = React.useState(0);

            const startGame = () => {
                const randomizedQuestions = shuffleArray(questionBank).map(q => {
                    const optionsWithIndex = q.options.map((opt, idx) => ({ text: opt, originalIndex: idx }));
                    const shuffledOptions = shuffleArray(optionsWithIndex);
                    return { ...q, shuffledOptions };
                });
                setQuestions(randomizedQuestions);
                setCurrentQIndex(0);
                setScore(0);
                setAttempts(0);
                setFeedback(null);
                setSelectedOption(null);
                setFirstTryCount(0);
                setSecondTryCount(0);
                setFailedCount(0);
                setGameState('playing');
            };

            const handleOptionClick = (optionIdx, originalIdx) => {
                if (feedback && (feedback.type === 'success' || feedback.type === 'explanation')) return;

                setSelectedOption(optionIdx);
                const currentQ = questions[currentQIndex];
                const isCorrect = originalIdx === currentQ.correctIndex;

                if (isCorrect) {
                    if (attempts === 0) {
                        setScore(prev => prev + 10);
                        setFirstTryCount(prev => prev + 1);
                        setFeedback({ type: 'success', text: currentQ.corroboration });
                    } else {
                        setScore(prev => prev + 5);
                        setSecondTryCount(prev => prev + 1);
                        setFeedback({ type: 'success', text: currentQ.corroboration });
                    }
                } else {
                    if (attempts === 0) {
                        setAttempts(1);
                        setFeedback({ type: 'hint', text: currentQ.hint });
                    } else {
                        setFailedCount(prev => prev + 1);
                        setFeedback({ type: 'explanation', text: currentQ.explanation });
                    }
                }
            };

            const nextQuestion = () => {
                if (currentQIndex + 1 < questions.length) {
                    setCurrentQIndex(prev => prev + 1);
                    setAttempts(0);
                    setFeedback(null);
                    setSelectedOption(null);
                } else {
                    setGameState('finished');
                }
            };

            if (gameState === 'start') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="bg-white p-8 rounded-2xl shadow-xl max-w-lg w-full text-center fade-in border-t-8 border-blue-600">
                            <h1 className="text-3xl font-bold text-gray-800 mb-4">Autoevaluación: Ecuación de la Recta</h1>
                            <p className="text-gray-600 mb-6 text-lg">
                                Poné a prueba lo que construimos en clase. Verificá cuánto comprendiste sobre las formas de representar algebraicamente una recta, cómo leer parámetros de un gráfico y cómo realizar inferencias.
                            </p>
                            <div className="bg-blue-50 text-blue-800 p-4 rounded-lg text-left mb-8 text-sm">
                                <ul className="list-disc pl-5 space-y-2">
                                    <li>Son 20 preguntas aleatorias.</li>
                                    <li>Al primer intento correcto sumás <strong>10 puntos</strong>.</li>
                                    <li>Si te equivocás, recibirás una pista, pero el puntaje bajará a <strong>5 puntos</strong> en el segundo intento.</li>
                                    <li>Si te equivocás dos veces, recibirás la explicación completa (0 pts).</li>
                                </ul>
                            </div>
                            <button 
                                onClick={startGame}
                                className="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full transition duration-300 w-full shadow-md text-lg">
                                ¡Comenzar ahora!
                            </button>
                        </div>
                    </div>
                );
            }

            if (gameState === 'finished') {
                const percentage = (score / (questions.length * 10)) * 100;
                let finalMessage = "";
                if (percentage >= 90) finalMessage = "¡Impecable! Entendiste a la perfección el comportamiento algebraico y gráfico de la recta.";
                else if (percentage >= 60) finalMessage = "¡Muy bien! Estás dominando el tema. Repasá los errores para pulir los detalles finales.";
                else finalMessage = "Hay conceptos que aún necesitan un empujoncito. Te sugiero releer los apuntes sobre cómo operar con igualdades y ubicar puntos.";

                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="bg-white p-8 rounded-2xl shadow-xl max-w-lg w-full text-center fade-in">
                            <i className="fa-solid fa-trophy text-6xl text-yellow-500 mb-4"></i>
                            <h2 className="text-3xl font-bold text-gray-800 mb-2">Evaluación Finalizada</h2>
                            <p className="text-xl text-gray-600 mb-6">Tu puntaje: <span className="font-bold text-blue-600">{score} / {questions.length * 10}</span></p>
                            
                            <div className="flex flex-col gap-3 mb-6 text-left bg-gray-50 p-5 rounded-xl border border-gray-200 shadow-inner">
                                <p className="text-gray-700 text-lg"><i className="fa-solid fa-check text-green-500 w-8 text-center"></i> Contestaste <strong>{firstTryCount}</strong> en el primer intento.</p>
                                <p className="text-gray-700 text-lg"><i className="fa-solid fa-lightbulb text-blue-500 w-8 text-center"></i> En <strong>{secondTryCount}</strong> necesitaste una ayudita.</p>
                                <p className="text-gray-700 text-lg"><i className="fa-solid fa-xmark text-red-500 w-8 text-center"></i> <strong>{failedCount}</strong> quedaron mal respondidas.</p>
                            </div>

                            <div className={`p-4 rounded-lg mb-8 ${percentage >= 60 ? 'bg-green-50 text-green-800' : 'bg-orange-50 text-orange-800'}`}>
                                <p className="font-medium text-lg">{finalMessage}</p>
                            </div>

                            <button 
                                onClick={startGame}
                                className="bg-gray-800 hover:bg-gray-900 text-white font-bold py-3 px-8 rounded-full transition duration-300 w-full">
                                <i className="fa-solid fa-rotate-right mr-2"></i> Volver a intentar
                            </button>
                        </div>
                    </div>
                );
            }

            const currentQ = questions[currentQIndex];
            const isAnswerLocked = feedback && (feedback.type === 'success' || feedback.type === 'explanation');

            return (
                <div className="min-h-screen py-8 px-4 flex flex-col items-center">
                    <div className="max-w-2xl w-full flex justify-between items-center mb-6 bg-white p-4 rounded-xl shadow-sm">
                        <div className="text-gray-600 font-semibold">
                            Pregunta <span className="text-blue-600 text-xl">{currentQIndex + 1}</span> / {questions.length}
                        </div>
                        <div className="text-gray-600 font-semibold">
                            Puntos: <span className="text-blue-600 text-xl">{score}</span>
                        </div>
                    </div>

                    <div className="bg-white p-6 md:p-8 rounded-2xl shadow-lg max-w-2xl w-full fade-in">
                        <h2 className="text-xl md:text-2xl font-bold text-gray-800 mb-6 leading-relaxed">
                            <LatexText text={currentQ.text} />
                        </h2>

                        {/* RENDER DEL GRÁFICO (si la pregunta lo tiene) */}
                        <CartesianGraph graphDef={currentQ.graph} />

                        <div className="space-y-3">
                            {currentQ.shuffledOptions.map((option, idx) => {
                                let buttonClass = "w-full text-left p-4 rounded-xl border-2 transition duration-200 text-lg font-medium ";
                                
                                if (isAnswerLocked) {
                                    if (option.originalIndex === currentQ.correctIndex) {
                                        buttonClass += "bg-green-50 border-green-500 text-green-800";
                                    } else if (idx === selectedOption) {
                                        buttonClass += "bg-red-50 border-red-400 text-red-700 opacity-70";
                                    } else {
                                        buttonClass += "border-gray-200 text-gray-400 bg-gray-50 opacity-50";
                                    }
                                } else {
                                    if (feedback && feedback.type === 'hint' && idx === selectedOption) {
                                        buttonClass += "bg-orange-50 border-orange-400 text-orange-700";
                                    } else {
                                        buttonClass += "border-gray-200 text-gray-700 hover:border-blue-400 hover:bg-blue-50 cursor-pointer";
                                    }
                                }

                                return (
                                    <button 
                                        key={idx}
                                        onClick={() => handleOptionClick(idx, option.originalIndex)}
                                        disabled={isAnswerLocked}
                                        className={buttonClass}
                                    >
                                        <div className="flex items-center">
                                            <span className="w-8 h-8 rounded-full bg-white border border-current flex items-center justify-center mr-4 shrink-0">
                                                {String.fromCharCode(65 + idx)}
                                            </span>
                                            <LatexText text={option.text} />
                                        </div>
                                    </button>
                                );
                            })}
                        </div>

                        {feedback && (
                            <div className={`mt-6 p-4 rounded-xl flex items-start fade-in ${
                                feedback.type === 'success' ? 'bg-green-100 text-green-800' :
                                feedback.type === 'hint' ? 'bg-orange-100 text-orange-800' :
                                'bg-red-100 text-red-800'
                            }`}>
                                <div className="mt-1 mr-3 shrink-0">
                                    {feedback.type === 'success' && <i className="fa-solid fa-circle-check text-xl"></i>}
                                    {feedback.type === 'hint' && <i className="fa-solid fa-circle-exclamation text-xl"></i>}
                                    {feedback.type === 'explanation' && <i className="fa-solid fa-circle-xmark text-xl"></i>}
                                </div>
                                <div>
                                    <h4 className="font-bold mb-1">
                                        {feedback.type === 'success' ? '¡Correcto!' : 
                                         feedback.type === 'hint' ? 'Pista...' : 
                                         'Respuesta Incorrecta'}
                                    </h4>
                                    <p className="text-sm md:text-base">
                                        <LatexText text={feedback.text} />
                                    </p>
                                </div>
                            </div>
                        )}

                        {isAnswerLocked && (
                            <div className="mt-8 flex justify-end fade-in">
                                <button 
                                    onClick={nextQuestion}
                                    className="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-xl transition duration-300 flex items-center shadow-md">
                                    {currentQIndex + 1 === questions.length ? 'Ver Resultados' : 'Siguiente Pregunta'}
                                    <i className="fa-solid fa-arrow-right ml-2"></i>
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
